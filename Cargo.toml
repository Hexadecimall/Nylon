[package]
name = "nylon"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["Nylon Contributors"]
description = "Native digital audio workstation"

[lib]
crate-type = ["rlib", "staticlib", "cdylib"]

[features]
default = ["plugin-probe"]
plugin-probe = []

[[bin]]
name = "nylon-plugin-probe"
path = "src/bin/nylon-plugin-probe.rs"
bench = false
test = false
required-features = ["plugin-probe"]

[[bin]]
name = "nylon-plugin-worker"
path = "src/bin/nylon-plugin-worker.rs"
bench = false
test = false
required-features = ["plugin-probe"]

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"

[[bench]]
name = "render"
harness = false

[[bench]]
name = "mixer"
harness = false

[[bench]]
name = "audio_timeline"
harness = false

[[bench]]
name = "routed_playback"
harness = false

[[bench]]
name = "reverb"
harness = false

[[bench]]
name = "auto_filter"
harness = false

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"

[dependencies]
clap-sys = "0.5.0"
libloading = "0.8"
