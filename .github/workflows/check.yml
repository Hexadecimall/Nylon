name: Check
on: [push, pull_request]

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel, windows-2025]
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sh scripts/lint-rules.sh
      - run: python3 -B scripts/rt_lint.py
      - run: python3 -B scripts/bootstrap.py
      - run: python3 -B -m unittest discover -s scripts -p 'test_*.py'
      - run: cargo fmt --check
      - run: cargo build --locked --all-targets
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo bench --locked --bench render
      - run: cargo install cargo-deny --version 0.20.2 --locked
      - run: cargo deny check
      - run: cargo build --locked --release
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y qt6-base-dev
      - if: runner.os != 'Linux'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          cache: true
      - run: cmake -S desktop -B target/desktop -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build target/desktop --config Release --parallel 2
      - run: ctest --test-dir target/desktop -C Release --output-on-failure
