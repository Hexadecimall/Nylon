name: Check
on: [push, pull_request]

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel, windows-2025]
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the sound library
        # The Linux backend opens it at run time, so its tests only reach
        # a device when it is present. Installing it here keeps that path
        # exercised rather than skipped.
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2t64
      - run: sh scripts/lint-rules.sh
      - run: python3 -B scripts/rt_lint.py
      - run: python3 -B scripts/bootstrap.py
      - run: python3 -B -m unittest discover -s scripts -p 'test_*.py'
      - run: cargo fmt --check
      - run: rustfmt --edition 2024 --check scripts/pathmap.rs
      - run: cargo build --locked --all-targets
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo bench --locked --bench render
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || (github.event.before != '0000000000000000000000000000000000000000' && github.event.before) || github.event.repository.default_branch }}
          path: target/perf-base
          persist-credentials: false
      - run: python3 -B scripts/benchmark_compare.py target/perf-base
      - run: cargo install cargo-deny --version 0.20.2 --locked
      - run: cargo deny check
      - run: cargo build --locked --release
