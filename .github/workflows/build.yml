name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  macos-universal:
    name: macOS universal
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - run: python3 -B scripts/bootstrap.py
      - name: Build the core for both architectures
        run: |
          cargo build --locked --release --target aarch64-apple-darwin
          cargo build --locked --release --target x86_64-apple-darwin
      - name: Join them into one library
        run: |
          mkdir -p target/package/lib
          lipo -create -output target/package/lib/libnylon.a \
            target/aarch64-apple-darwin/release/libnylon.a \
            target/x86_64-apple-darwin/release/libnylon.a
          lipo -create -output target/package/lib/libnylon.dylib \
            target/aarch64-apple-darwin/release/libnylon.dylib \
            target/x86_64-apple-darwin/release/libnylon.dylib
          lipo -info target/package/lib/libnylon.a target/package/lib/libnylon.dylib
      - name: Verify both architectures are present
        run: |
          lipo -info target/package/lib/libnylon.a | tee /dev/stderr \
            | grep -q 'x86_64 arm64\|arm64 x86_64'
      - name: Collect the headers and the build rules
        run: |
          mkdir -p target/package/include target/package/cmake
          cp bindings/c/nylon.h target/package/include/
          cp bindings/cpp/nylon.hpp target/package/include/
          cp bindings/cmake/NylonCore.cmake target/package/cmake/
          cp LICENSE target/package/
      - name: Package
        run: ditto -c -k --keepParent target/package target/nylon-macos-universal.zip
      - uses: actions/upload-artifact@v4
        with:
          name: nylon-macos-universal
          path: target/nylon-macos-universal.zip

  linux:
    name: Linux ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: python3 -B scripts/bootstrap.py
      - run: cargo build --locked --release
      - name: Collect the library, the headers and the build rules
        run: |
          mkdir -p target/package/lib target/package/include target/package/cmake
          cp target/release/libnylon.a target/package/lib/
          cp target/release/libnylon.so target/package/lib/
          cp bindings/c/nylon.h target/package/include/
          cp bindings/cpp/nylon.hpp target/package/include/
          cp bindings/cmake/NylonCore.cmake target/package/cmake/
          cp LICENSE target/package/
          file target/package/lib/libnylon.so
      - name: Package
        run: tar -C target/package -czf target/nylon-linux-${{ matrix.arch }}.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: nylon-linux-${{ matrix.arch }}
          path: target/nylon-linux-${{ matrix.arch }}.tar.gz

  windows:
    name: Windows ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            arch: x64
            target: x86_64-pc-windows-msvc
          - runner: windows-11-arm
            arch: arm64
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -B scripts/bootstrap.py
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Collect the library, the headers and the build rules
        run: |
          mkdir -p target/package/lib target/package/include target/package/cmake
          cp target/${{ matrix.target }}/release/nylon.lib target/package/lib/
          cp target/${{ matrix.target }}/release/nylon.dll target/package/lib/
          cp target/${{ matrix.target }}/release/nylon.dll.lib target/package/lib/
          cp bindings/c/nylon.h target/package/include/
          cp bindings/cpp/nylon.hpp target/package/include/
          cp bindings/cmake/NylonCore.cmake target/package/cmake/
          cp LICENSE target/package/
      - name: Package
        run: 7z a target/nylon-windows-${{ matrix.arch }}.zip ./target/package/*
      - uses: actions/upload-artifact@v4
        with:
          name: nylon-windows-${{ matrix.arch }}
          path: target/nylon-windows-${{ matrix.arch }}.zip
